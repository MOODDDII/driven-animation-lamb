<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        color: white;
        font-family: Arial, sans-serif;
        filter: gray(0.9);
      }

      .content {
        height: 400vh;
        position: relative;
      }

      .scrub-video {
        position: sticky;
        top: 0;
        width: 100%;
        height: 100vh;
        object-fit: cover;
        display: block;
        z-index: 0;
        filter: grayscale(60%);
      }

      .text {
        position: absolute;
        z-index: 2;
        pointer-events: none;
        white-space: nowrap;

        font-size: clamp(3rem, 10vw, 9rem);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.06em;
        color: white;

        opacity: 0;
        transform: translateY(35px);

        animation: reveal linear both;
        animation-timeline: view();
        animation-range: entry 0% entry 100%;
      }

      .text-0 {
        top: 50vh;
        left: 50%;
        translate: -50% -50%;
      }

      .text-1 {
        top: 100vh;
        left: 6vw;
      }

      .text-2 {
        top: 170vh;
        right: 6vw;
      }

      .text-3 {
        top: 240vh;
        left: 6vw;
      }

      .text-4 {
        top: 320vh;
        left: 0;
        width: 100%;
        text-align: center;
      }

      @keyframes reveal {
        0% {
          opacity: 0;
          transform: translateY(35px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .content::after {
        content: "";
        position: absolute;
        inset: 0;
        height: 100vh;
        z-index: 1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main class="content">
      <video
        muted
        playsinline
        preload="auto"
        class="scrub-video"
        src="./assets/car-edit.mp4"
      ></video>

      <span class="text text-0">Soooo</span>
      <span class="text text-1">Where</span>
      <span class="text text-2">is</span>
      <span class="text text-3">your</span>
      <span class="text text-4">Mercedes?</span>
    </main>

    <script>
      const section = document.querySelector(".content");
      const video = document.querySelector(".scrub-video");

      const updateVideo = () => {
        const rect = section.getBoundingClientRect();
        const totalScroll = section.offsetHeight - window.innerHeight;

        const progress = -rect.top / totalScroll;

        if (video.duration) {
          video.currentTime = progress * video.duration;
        }
      };

      document.addEventListener("scroll", updateVideo);
      video.addEventListener("loadedmetadata", updateVideo);

      if (video.readyState >= 1) updateVideo();
    </script>
  </body>
</html>
